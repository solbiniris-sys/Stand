<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a22">
<title>같은 골목</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>

<div id="login" class="screen">
  <p class="eyebrow">서나기 · 이준야</p>
  <h1>같은 골목</h1>
  <p class="sub">해산물이 오는 날부터, 졸업 그 이후까지.</p>
  <input id="room" placeholder="세션 코드" autocomplete="off">
  <input id="pw" type="password" placeholder="비밀번호 (4자 이상)">
  <div class="row"><button class="btn" onclick="go('nagi')">서나기로 입장</button><button class="btn" onclick="go('junya')">이준야로 입장</button></div>
</div>

<div id="alloc" class="screen" hidden>
  <p class="eyebrow">시작 전에</p>
  <h2>능력치 분배</h2>
  <p class="sub">모든 능력치는 2에서 시작해요. 남은 포인트를 나눠 주세요. (최대 8)</p>
  <div id="ast"></div>
  <select id="tr" aria-label="특성"></select><p class="left">남은 포인트 <b id="pl">14</b></p>
  <button class="btn" id="aok" onclick="allocOk()">확정하기</button>
</div>

<div id="game" hidden>
  <header>
    <div class="h1"><b id="chn"></b><span id="dt"></span></div>
    <div class="hr"><span id="stg"></span><span class="bar"><i id="bond"></i></span><span id="en" aria-label="행동력"></span></div>
  </header>
  <nav>
    <button data-t="rp" class="on"><em>💬</em>역극<i></i></button>
    <button data-t="act"><em>🧭</em>행동<i></i></button>
    <button data-t="life"><em>🌾</em>골목살림<i></i></button>
    <button data-t="ooc"><em>☕</em>잡담<i></i></button>
    <button data-t="me"><em>📒</em>기록<i></i></button>
  </nav>

  <section id="p-rp" class="panel">
    <div id="rplog" class="log"></div>
    <div class="in"><select id="k" aria-label="말풍선 종류"><option value="say">대사</option><option value="act">지문</option><option value="mind">속마음</option></select><input id="t" placeholder="장면을 이어가요" autocomplete="off"><button class="btn" onclick="say()">전송</button></div>
  </section>

  <section id="p-act" class="panel" hidden>
    <div id="evbox"></div>
    <div id="jobs"></div>
    <div id="daybar"></div>
  </section>

  <section id="p-life" class="panel" hidden><div id="life"></div></section>

  <section id="p-ooc" class="panel" hidden>
    <p class="hint">오너끼리 잡담하는 방이에요. 역극 기록에는 남지 않아요.</p>
    <div id="ooclog" class="log"></div>
    <div class="in"><input id="o" placeholder="오너 잡담" autocomplete="off"><button class="btn" onclick="ooc()">전송</button></div>
  </section>

  <section id="p-me" class="panel" hidden>
    <div id="side"></div>
    <h3>일기장 (나만 보임)</h3>
    <div class="in"><input id="dti" placeholder="오늘의 마음" autocomplete="off"><button class="btn" onclick="dia()">저장</button></div>
    <div id="dr"></div>
    <h3>앨범</h3><div id="al"></div>
    <h3>주변 사람들</h3><div id="npc"></div>
    <div class="grid2" style="margin-top:18px"><button class="btn ghost" id="vote" onclick="send({type:'vote'})"></button><button class="btn ghost" onclick="exp()">대화 내보내기</button></div>
  </section>
</div>

<!-- 장소 행동 선택 시트 -->
<div id="sheet" hidden><div class="sheet-in" role="dialog" aria-modal="true" aria-label="행동 선택"><div class="grab"></div><div id="sh"></div></div></div>

<!-- 낚시 미니게임 -->
<div id="fish" hidden role="dialog" aria-label="낚시">
  <div class="fbox"><button class="x" id="fx" aria-label="닫기">✕</button>
    <p id="fmsg">찌를 던졌어요…</p>
    <div id="ftrack"><i id="fzone"></i><i id="fmark"></i></div>
    <p class="hint" id="fhint">초록 구간에서 화면을 터치!</p>
  </div>
</div>

<!-- 텃밭 미니게임 (물 주기 · 잡초 · 벌레 · 수확) -->
<div id="tend" hidden role="dialog" aria-label="텃밭 일">
  <div class="tbox"><button class="x" id="tx" aria-label="닫기">✕</button>
    <b id="tt"></b><p id="tmsg"></p><div id="tstage"></div><p class="hint" id="thint"></p>
  </div>
</div>

<!-- 주사위: 돌아가는 중에 터치하면 결과로, 결과에서 터치하면 다음으로 -->
<div id="dice" hidden role="dialog" aria-label="주사위 판정">
  <p id="dinfo"></p><div id="cube"></div>
  <div id="dres" hidden><div id="dv"></div><div id="dn"></div><p id="dt2"></p></div>
  <p id="dtap"></p>
  <button class="btn ghost" id="dall">모두 건너뛰기</button>
</div>

<div id="pops" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="net" hidden>연결이 끊겼어요. 다시 연결하는 중…</div>
<div id="recap" hidden></div>
<script src="app.js"></script>
</body></html>
